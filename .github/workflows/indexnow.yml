# After each push to main, tell Bing (and the other IndexNow search engines) which pages changed,
# so they recrawl them within hours instead of weeks. Bing's index also feeds ChatGPT search and Copilot.
name: Tell search engines what changed
on:
  push:
    branches: [main]
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for the Vercel deployment to go live
        run: sleep 180
      - name: Submit changed pages
        run: |
          python3 - <<'PY'
          import json, re, subprocess, urllib.request
          key = json.load(open('src/content/site.json'))['indexnow_key']
          now = json.load(open('src/content/lastmod.json'))
          try:
              before = json.loads(subprocess.run(['git', 'show', 'HEAD~1:src/content/lastmod.json'], capture_output=True, text=True, check=True).stdout)
          except Exception:
              before = {}
          locs = re.findall(r'<loc>(.*?)</loc>', open('sitemap.xml').read())
          names = list(now)
          changed = [locs[i] for i, n in enumerate(names) if i < len(locs) and before.get(n, {}).get('hash') != now[n]['hash']]
          if not changed:
              print('::notice title=IndexNow::No page content changed, nothing to submit'); raise SystemExit
          body = json.dumps({'host': 'wearefreak.com', 'key': key, 'keyLocation': f'https://wearefreak.com/{key}.txt', 'urlList': changed}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type': 'application/json; charset=utf-8'})
          with urllib.request.urlopen(req) as r:
              print(f'::notice title=IndexNow::{r.status}, submitted {len(changed)} pages: ' + ' '.join(u.replace('https://wearefreak.com', '') or '/' for u in changed))
          PY
      - name: Check the live site
        run: |
          KEY=$(python3 -c "import json;print(json.load(open('src/content/site.json'))['indexnow_key'])")
          out=""; bad=0
          for u in / /work /work/hoover /capabilities /sitemap.xml /robots.txt /llms.txt /$KEY.txt "/cbto9su/x.php" /budweiser; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://wearefreak.com$u")
            if [ "${c#3}" != "$c" ]; then c="$c>$(curl -s -o /dev/null -w '%{redirect_url}' "https://wearefreak.com$u")>$(curl -sL -o /dev/null -w '%{http_code}' "https://wearefreak.com$u")"; fi
            out="$out $u=$c"
          done
          echo "::notice title=Live check::$out"
          case "$out" in *" /="200*|*" /="30*">200"*) ;; *) bad=1 ;; esac
          exit $bad
